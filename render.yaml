services:
  - type: web
    name: autonomous-qa-runner
    runtime: python
    plan: free
    region: singapore
    branch: main
    autoDeploy: true
    buildCommand: pip install . && playwright install chromium
    startCommand: uvicorn src.api_server:app --host 0.0.0.0 --port $PORT --workers 1
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.10"
      - key: LLM_PROVIDER
        value: openrouter
      - key: LLM_BASE_URL
        value: https://openrouter.ai/api/v1
      - key: LLM_MODEL
        value: openrouter/free
      - key: MAILTM_ENABLED
        value: "true"
      - key: QA_MAX_DEPTH
        value: "2"
      - key: HEADLESS
        value: "true"
      - key: QA_VISUAL_DIFF
        value: "true"
      - key: QA_LOG_LEVEL
        value: INFO
      - key: QA_REPORTS_DIR
        value: reports
