name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  PYTHON_VERSION: "3.12"

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install Poetry
        run: python -m pip install --upgrade pip
      - name: Install dependencies
        run: python -m pip install -e . ruff mypy pytest-cov
      - name: Run ruff
        run: python -m ruff check src/ tests/

  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install Poetry
        run: python -m pip install --upgrade pip
      - name: Install dependencies
        run: python -m pip install -e . ruff mypy pytest-cov
      - name: Run mypy
        run: python -m mypy src/

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: [lint, typecheck]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install Poetry
        run: python -m pip install --upgrade pip
      - name: Install dependencies
        run: python -m pip install -e . ruff mypy pytest-cov
      - name: Install Playwright browsers
        run: python -m playwright install chromium --with-deps
      - name: Run unit tests with coverage
        run: python -m pytest tests/unit/ --cov=src --cov-report=xml --cov-report=term-missing -v
      - name: Upload coverage report
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.xml
          fail_ci_if_error: false

  integration:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: [unit-tests]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install Poetry
        run: python -m pip install --upgrade pip
      - name: Install dependencies
        run: python -m pip install -e . ruff mypy pytest-cov
      - name: Install Playwright browsers
        run: python -m playwright install chromium --with-deps
      - name: Run integration tests
        run: python -m pytest tests/integration/ -v -s
      - name: Upload reports artifact on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: qa-reports-${{ github.run_id }}
          path: reports/
          retention-days: 7
